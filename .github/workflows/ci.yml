name: CI

on:
  push:
    branches: [main, master, Sonar]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install hash-locked test dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary :all: --require-hashes -r requirements-dev.txt

      - name: Lint (syntax / undefined names)
        run: ruff check src tests --select=E9,F63,F7,F82

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: pytest -v --ignore=tests/test_smoke_import.py

  smoke-gtk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install GTK4 / Libadwaita + PyGObject
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            python3-pytest xvfb

      - name: Smoke-import full GTK app
        env:
          PYTHONPATH: src
        run: xvfb-run -a pytest -v tests/test_smoke_import.py
